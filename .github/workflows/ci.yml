name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build AkikazuHardwareCheck.slnx -c Release --nologo

      - name: Unit tests
        run: .\tests\AkikazuHardwareCheck.Core.Tests\bin\Release\net10.0-windows\win-x64\AkikazuHardwareCheck.Core.Tests.exe

      - name: Window smoke tests
        run: .\tests\AkikazuHardwareCheck.App.SmokeTests\bin\Release\net10.0-windows\win-x64\AkikazuHardwareCheck.App.SmokeTests.exe

      - name: Store payload
        run: .\scripts\publish-store-payload.ps1
